<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9defa">
  <title>I'm Sorry 💗</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Floating hearts layer -->
  <div id="hearts" aria-hidden="true"></div>

  <!-- Top bar: back, progress, music -->
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Go back">←</button>
    <div class="progress-wrap" aria-hidden="true">
      <div class="progress-track"><div id="bar"></div></div>
      <small id="count"></small>
    </div>
    <button id="musicBtn" class="icon-btn" aria-label="Toggle music">🎵</button>
  </header>

  <!-- Story screen is rendered here by script.js -->
  <main id="stage" class="container"></main>

  <!-- Secret heart -->
  <button id="secret" aria-label="Secret heart">🤍</button>
  <div id="toast" role="status"></div>

  <!-- Full-screen celebration / hug overlay -->
  <div id="overlay"></div>

  <audio id="music" loop preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
